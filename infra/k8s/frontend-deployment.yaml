apiVersion: apps/v1
kind: Deployment
metadata:
  name: hajer-frontend
  namespace: phdstudio
  labels:
    app: hajer-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hajer-site
  template:
    metadata:
      labels:
        app: hajer-site
    spec:
      containers:
        - name: hajer-frontend
          image: donavanalencar/hajer-site:latest
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PORT
              value: "80"
            - name: HOST
              value: "0.0.0.0"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: hajer-web-service
  namespace: phdstudio
  labels:
    app: hajer-site
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: hajer-site

